name: Rust Python Healer Windows x64 qualification

on:
  workflow_dispatch:
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "python/**"
      - "tests/**"
      - "windows_qa/**"
      - ".github/workflows/windows-native-matrix.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "python/**"
      - "tests/**"
      - "windows_qa/**"
      - ".github/workflows/windows-native-matrix.yml"

permissions:
  contents: read

concurrency:
  group: windows-qualify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-cpython:
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Bootstrap reviewed acquisition with Windows CPython
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          architecture: x64
      - name: Record actual external run and exact checked-out commit
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path windows-evidence -Force | Out-Null
          $checkedOut = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $checkedOut -ne $env:GITHUB_SHA) {
            throw "CHECKED_OUT_COMMIT_DOES_NOT_MATCH_RUN"
          }
          @{ run_id=$env:GITHUB_RUN_ID; run_attempt=$env:GITHUB_RUN_ATTEMPT;
             repository=$env:GITHUB_REPOSITORY; commit=$checkedOut;
             runner_os=$env:RUNNER_OS; requested_minor="${{ matrix.python }}" } |
            ConvertTo-Json | Set-Content -Encoding utf8 windows-evidence/external-run.json
      - name: Acquire exact primary-pinned CPython and Ruff bytes
        shell: pwsh
        run: |
          python -I -B windows_qa/ci_bootstrap.py --minor "${{ matrix.python }}" --destination .ci-runtime 2>&1 |
            Tee-Object -FilePath windows-evidence/bootstrap.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tools = Get-Content -LiteralPath .ci-runtime/environment.json -Raw | ConvertFrom-Json
          if ($tools.status -ne "EXACT_PRIMARY_TOOL_BYTES_PREPARED_NOT_EXECUTED") {
            throw "PRIMARY_TOOL_IDENTITY_NOT_VERIFIED"
          }
          Copy-Item -LiteralPath .ci-runtime/environment.json -Destination windows-evidence/toolchain.json
          (Split-Path -Parent $tools.python_executable) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "RPH_RUFF_BIN=$($tools.ruff_executable)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify baseline has not been lost
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "Cargo.toml")) {
            throw "PRIMARY_RUST_PROJECT_NOT_RESTORED"
          }
          if (-not (Test-Path -LiteralPath "tests")) {
            throw "PRIMARY_TESTS_NOT_RESTORED"
          }
      - name: Trusted Python-only Windows validation tests
        shell: pwsh
        run: python -I -B -m unittest discover -s windows_qa/tests -p "test_*.py" -q
      - name: Record genuine host and subprocess evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path windows-evidence -Force | Out-Null
          python -I -B windows_qa/windows_runtime.py --expected-minor "${{ matrix.python }}" --output "windows-evidence/python-${{ matrix.python }}.json"
      - name: Run exactly 100 independent curated language cases on this real minor
        shell: pwsh
        run: |
          python -I -B windows_qa/qualify_curated.py --expected-minor "${{ matrix.python }}" --output "windows-evidence/curated-${{ matrix.python }}.json"
      - name: Native Rust Windows-x64 structural preflight tests
        shell: pwsh
        run: cargo test --manifest-path windows_qa/Cargo.toml --offline
      - name: Diagnose the fixed crypto selftest without raw paths or secrets
        shell: pwsh
        run: |
          python -I -S -B windows_qa/crypto_fixed_diagnostic.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real main Rust project Windows compilation and tests
        shell: pwsh
        run: |
          cargo test --locked --all-targets -- --include-ignored --skip windows_policy::tests::native_nonce_worker
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Previously reviewed Python fixture regressions
        shell: pwsh
        run: python -I -B -m unittest discover -s tests -p "test_*_v27.py" -q
      - name: Preserve evidence even on failed jobs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-evidence-${{ matrix.python }}
          path: windows-evidence/
          if-no-files-found: warn
          retention-days: 14
