[package]
name = "rust-python-healer"
version = "0.27.0"
edition = "2021"
description = "Conservative Rust-orchestrated Python diagnosis and repair candidates"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
libc = "0.2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1

